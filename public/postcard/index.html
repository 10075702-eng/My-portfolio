<header><div><strong>明信片之外</strong><br><small>BEYOND THE POSTCARD</small></div><div style="display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end"><button id="language">English</button><button id="home">选择地点</button></div></header>
<main><section id="landing"><span class="step">一段风景，多种留下它的方式</span><h1>你会把什么<br>留在画面之外？</h1><p>选一个地点，转动全景，制作你的明信片。再走近那些容易被忽略的细节，决定最后留下什么。</p><div id="cards" class="cards"></div></section>
<section id="experience" class="hidden"><div class="step" id="progress"></div><h2 id="place"></h2><div class="layout"><div><div id="view" class="view"><canvas id="pano" tabindex="0" aria-label="全景：拖动或使用方向键转动"></canvas><div id="spots"></div><div id="zoomControls" style="position:absolute;top:12px;right:12px;display:flex;gap:6px;align-items:center;background:#fffdf7ed;border-radius:24px;padding:4px"><button id="zoomOut" aria-label="缩小镜头">−</button><output id="zoomValue">1.0×</output><button id="zoomIn" aria-label="放大镜头">＋</button><button id="zoomReset" aria-label="重置缩放">重置</button></div><span class="hint">拖动转头 · ＋ / − 缩放</span></div><img id="postcard" class="hidden" alt="你的明信片"><div class="toolbar"><button id="back">上一步</button><button id="next">选定这个取景</button></div><p id="status" role="status" class="status"></p></div><aside><h2 id="heading"></h2><p id="instruction"></p><div id="choices" class="choices"></div></aside></div></section></main>
<dialog id="modal"><div class="toolbar"><strong id="videoTitle"></strong><button id="close">关闭视频</button></div><video id="video" controls playsinline preload="metadata"></video><p id="videoNote"></p><p id="videoError" role="status"></p></dialog>
<footer>Junhang Zhou · 个人概念项目 / 实拍素材。包装为调色实验，未使用 AI 生成画面。视频含现场声；全景探索阶段无独立环境声。</footer>

async function enter(s){stopVideo();scene=s;step=0;yaw=s.id==='scene-a-thames'?0:0;pitch=0;zoom=1;pack=0;look={yaw:0,pitch:0,zoom:1};seen=new Set();ending=null;ready=false;const t=++token;$('landing').classList.add('hidden');$('experience').classList.remove('hidden');$('status').textContent=tr("正在加载高清全景…","Loading the high-resolution panorama…");render();if(!gl){$('status').textContent=tr("浏览器无法启用 WebGL，请换支持 WebGL 的浏览器。","WebGL is unavailable. Please use a browser that supports WebGL.");return}let img=new Image();img.onload=()=>{if(t!==token)return;let source=img,max=gl.getParameter(gl.MAX_TEXTURE_SIZE);if(img.width>max){let cv=document.createElement('canvas');cv.width=max;cv.height=max/2;cv.getContext('2d').drawImage(img,0,0,cv.width,cv.height);source=cv}let tex=gl.createTexture();gl.bindTexture(gl.TEXTURE_2D,tex);gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MIN_FILTER,gl.LINEAR);gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MAG_FILTER,gl.LINEAR);gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_S,gl.CLAMP_TO_EDGE);gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_T,gl.CLAMP_TO_EDGE);gl.texImage2D(gl.TEXTURE_2D,0,gl.RGBA,gl.RGBA,gl.UNSIGNED_BYTE,source);ready=true;$('status').textContent=tr("全景已加载，可以拖动取景。","Panorama ready. Drag to choose your view.");render();draw()};img.onerror=()=>{if(t===token)$('status').textContent=tr("全景加载失败，请检查网络后重新进入地点。","The panorama could not load. Check your connection and open the place again.")};img.src=s.panorama}
function button(label,fn,selected=false){let b=document.createElement('button');b.textContent=label;b.onclick=fn;b.setAttribute('aria-pressed',String(selected));$('choices').append(b)}
